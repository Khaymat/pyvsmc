[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvsmc"
version = "0.3.6"
description = "Ultra-fast, fully vectorized market structure and Smart Money Concepts (SMC) technical analysis using NumPy and Polars"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "pyvsmc contributors", email = "rafikhairan120@gmail.com" },
]
maintainers = [
    { name = "pyvsmc maintainers", email = "rafikhairan120@gmail.com" },
]
keywords = ["trading", "technical-analysis", "smart-money-concepts", "smc", "market-structure", "numpy", "polars", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "polars>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "numpy>=1.24.0",
    "polars>=0.20.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "numpy>=1.24.0",
    "polars>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/Khaymat/pyvsmc"
Repository = "https://github.com/Khaymat/pyvsmc"
Documentation = "https://github.com/Khaymat/pyvsmc#readme"
Issues = "https://github.com/Khaymat/pyvsmc/issues"
Changelog = "https://github.com/Khaymat/pyvsmc/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyvsmc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "TCH"]
ignore = ["E501", "E702", "E402", "F841", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = "polars.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["pyvsmc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
